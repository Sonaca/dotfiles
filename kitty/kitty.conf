# ~/.config/kitty/kitty.conf
# Los colores los genera Noctalia desde el wallpaper (plantilla "kitty")
include themes/noctalia.conf

# ── Shell: zsh siempre (Win+T en niri abre kitty) ──
shell /usr/bin/zsh

# ── Fuente ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5
disable_ligatures never

# ── Aspecto ──
background_opacity 0.82
window_padding_width 10 14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.1 0.3

# ── Pestañas ──
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# ── Divisiones (como en el curso: Ctrl+Shift+Enter) ──
enabled_layouts splits,stack
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+z     toggle_layout stack
map ctrl+left        neighboring_window left
map ctrl+right       neighboring_window right
map ctrl+up          neighboring_window up
map ctrl+down        neighboring_window down
map ctrl+shift+t     new_tab_with_cwd

# ── Varios ──
copy_on_select clipboard
scrollback_lines 10000
url_style curly
